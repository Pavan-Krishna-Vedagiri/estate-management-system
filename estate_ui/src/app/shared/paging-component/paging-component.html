<div class="pagination-container">
    <!-- First / Prev -->
    <button class="first">⏮ First</button>
    <button class="prev">« Prev</button>

    <!-- Page info -->
    <span class="page-info">
        Page <span id="current-page">{{pageDetail.pageNumber}}</span> of <span id="total-pages">{{pageDetail.totalPages}}</span>
    </span>

    <!-- Next / Last -->
    <button class="next">Next »</button>
    <button class="last">⏭ Last</button>

    <!-- Items per page -->
    <div class="page-size">
        <label for="size">Items per page:</label>
        <select id="size">
            <option value="5" [selected]="pageDetail.pageSize == 5">5</option>
            <option value="10" [selected]="pageDetail.pageSize == 10">10</option>
            <option value="20" [selected]="pageDetail.pageSize == 20">20</option>
            <option value="50" [selected]="pageDetail.pageSize == 50">50</option>
        </select>
    </div>

</div>
